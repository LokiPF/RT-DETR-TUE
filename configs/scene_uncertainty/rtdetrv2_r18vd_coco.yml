__include__:
  - ../runtime.yml
  - ../rtdetrv2/include/rtdetrv2_r50vd.yml

task: detection
model: RTDETR
num_classes: 80
use_focal_loss: true
eval_spatial_size: [640, 640]

PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: false
  pretrained: false

HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5

RTDETRTransformerv2:
  num_layers: 3
  num_queries: 300
