__include__: [
  '../dataset/coco_detection_home.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_r50vd.yml',
]

task: tu_estimation
model: TUERTDETR

# tu_estimation (TUESolver.fit) collects persistence diagrams to build
# frechet_means.pth in the first place, so it must run the plain RTDETR
# model here -- TUERTDETR requires an already-built frechet_means.pth to
# even construct, which does not exist yet at this stage. Point a
# separate config at TUERTDETR (see include/rtdetrv2_r50vd.yml) once
# frechet_means.pth has been produced by this run.
RTDETR:
  decoder: TUERTDETRTransformerv2

output_dir: ./output/rtdetrv2_r18vd_120e_coco_tue


PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: False
  pretrained: True


HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5


TUERTDETRTransformerv2:
  num_layers: 3

RTDETRTransformerv2:
  num_layers: 3

RTDETRCriterionv2:
  losses: [vfl, boxes]
  weight_dict:
    loss_vfl: 1
    loss_bbox: 5
    loss_giou: 2


epoches: 120 

optimizer:
  type: AdamW
  params:
    - 
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.


train_dataloader: 
  dataset: 
    transforms:
      policy:
        epoch: 117
  collate_fn:
    scales: ~
  total_batch_size: 16

val_dataloader:
  total_batch_size: 64