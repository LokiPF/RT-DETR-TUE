__include__: [
  '../dataset/coco_detection_home.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_r50vd.yml',
]

task: tue_calibration
model: TUERTDETR

# Calibration hooks the detector heads directly, so use plain RTDETR here.
# TUERTDETR is reserved for the separate inference config after both artifacts
# have been produced; this avoids loading and recomputing stale TUE references.
RTDETR:
  decoder: TUERTDETRTransformerv2

output_dir: ./output/rtdetrv2_r18vd_120e_coco_tue_majority_t05

TUERTDETR:
  backbone: PResNet
  encoder: HybridEncoder
  decoder: TUERTDETRTransformerv2
  frechet_means: output/rtdetrv2_r18vd_120e_coco_tue_majority_t05/frechet_means.pth
  conformal_distances: output/rtdetrv2_r18vd_120e_coco_tue_majority_t05/conformal_distances.pth
  decoder_layers: null
  tue_confidence_threshold: 0.5
  tue_topk: 1

train_calibration_split_path: /home/philip/datasets/coco/annotations/instances_train_calibration_split.json
conformal_calibration_population: predicted
persistence_confidence_threshold: 0.5
conformal_confidence_threshold: 0.5
frechet_means_path: output/rtdetrv2_r18vd_120e_coco_tue_majority_t05/frechet_means.pth
# Majority-class proof of concept: person, car, bottle, chair (COCO labels).
# These classes have enough fitted/calibration detections to avoid the very
# coarse p-values produced by rare classes.
calibration_class_ids: [0, 2, 39, 56]

PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: False
  pretrained: True


HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5


TUERTDETRTransformerv2:
  num_layers: 3

RTDETRTransformerv2:
  num_layers: 3

RTDETRCriterionv2:
  losses: [vfl, boxes]
  weight_dict:
    loss_vfl: 1
    loss_bbox: 5
    loss_giou: 2


epoches: 120 

optimizer:
  type: AdamW
  params:
    - 
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.


train_dataloader: 
  dataset: 
    transforms:
      # Calibration must match deterministic inference preprocessing. Keep the
      # box conversion because Fréchet fitting still uses the matcher.
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: default
  collate_fn:
    scales: ~
  total_batch_size: 16
